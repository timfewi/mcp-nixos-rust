name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - '.github/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.cursorrules'
      - 'RELEASE_NOTES.md'
      - 'RELEASE_WORKFLOW.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - '.github/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.cursorrules'
      - 'RELEASE_NOTES.md'
      - 'RELEASE_WORKFLOW.md'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true

    - name: Check flake
      run: |
        nix flake check
        nix flake show --all-systems --json >/dev/null

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
    - uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true

    - name: Build Nix package
      run: nix build

    - name: Test package runs
      run: |
        ./result/bin/mcp-nixos --version


  lint:
    runs-on: ubuntu-latest
    needs: check
    steps:
    - uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true

    - name: Lint with clippy
      run: nix develop --command cargo clippy --all-targets -- -D warnings

    - name: Check formatting
      run: nix develop --command cargo fmt --check

  test:
    runs-on: ubuntu-latest
    needs: check
    steps:
    - uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true

    - name: Run tests
      timeout-minutes: 10
      run: nix develop --command cargo test

  # Verify the release image still builds on both supported Linux architectures.
  docker-build:
    runs-on: ${{ matrix.runner }}
    needs: [build, lint, test]
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            arch: arm64
            system: aarch64-linux
    steps:
    - uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true

    - name: Build Docker image with Nix
      run: nix build .#packages.${{ matrix.system }}.docker
